<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détecteur Violet - Précision HSL</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; text-align: center; overflow: hidden; }
        #video { width: 100vw; height: 50vh; object-fit: cover; }
        #controls { padding: 15px; background: #111; position: absolute; bottom: 0; width: 100%; box-sizing: border-box; }
        button { background: #ff4757; color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; width: 100%; max-width: 300px; }
        .status { margin-top: 10px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div id="controls">
        <button id="startBtn">ACTIVER L'ALARME</button>
        <div class="status" id="statusText">Statut : En attente d'activation...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');

        let audioCtx = null;
        let isRunning = false;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { statusText.innerText = "Erreur caméra : " + err; });

        startBtn.addEventListener('click', () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }

            isRunning = true;
            startBtn.style.backgroundColor = "#2ed573";
            startBtn.innerText = "ALARME ACTIVE";
            statusText.innerText = "Surveillance HSL active (1 image/sec)...";

            // Analyse ralentie et optimisée batterie (1 fois par seconde)
            setInterval(analyzeColor, 1000);
        });

        function playAlarm() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // Fonction pour convertir RVB en Teinte (Hue) et isoler le vrai violet du bleu
        function rgbToHue(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, d = max - min;
            if (d === 0) return 0;
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            return h * 60; // Retourne l'angle de la couleur sur 360 degrés
        }

        function analyzeColor() {
            if (!isRunning) return;
            
            // Basse résolution pour préserver la batterie
            canvas.width = video.videoWidth / 4;   
            canvas.height = video.videoHeight / 4;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = frame.data;
            let violetCount = 0;

            for (let i = 0; i < data.length; i += 16) { 
                let r = data[i], g = data[i+1], b = data[i+2];
                let hue = rgbToHue(r, g, b);
                let max = Math.max(r, g, b);
                let min = Math.min(r, g, b);
                let saturation = max === 0 ? 0 : (max - min) / max;
                let lightness = max / 255;

                // Le bleu foncé a un Hue élevé (> 210°). 
                // Le violet se situe strictement entre 265° et 325° avec assez de lumière et de saturation.
                let isViolet = (hue >= 265 && hue <= 325 && saturation > 0.3 && lightness > 0.2); 

                if (isViolet) {
                    violetCount++;
                }
            }

            if (violetCount > 15) {
                statusText.innerText = "ALERTE : VIOLET DÉTECTÉ !";
                statusText.style.color = "#ff4757";
                playAlarm();
            } else {
                statusText.innerText = "Surveillance active... (Ras)";
                statusText.style.color = "#2ed573";
            }
        }
    </script>
</body>
</html>
